<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي V2 | المدير المالي</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fa; color: #1e293b; }
    header { background: #102b46; color: white; padding: 28px 20px; text-align: center; }
   .container { width: 92%; max-width: 1000px; margin: 25px auto; }
   .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
   .card { background: white; padding: 22px; border-radius: 14px; box-shadow: 0 3px 12px #0000000d; border-top: 4px solid #2563eb; }
   .amount { font-size: 25px; font-weight: bold; }
   .income { border-color: #16a34a; }.expenses { border-color: #dc2626; }
   .balance { border-color: #2563eb; }.debt-in { border-color: #7c3aed; }.debt-out { border-color: #ea580c; }
   .section { margin-top: 25px; background: white; padding: 22px; border-radius: 14px; box-shadow: 0 3px 12px #0000000d; }
   .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    input, select, textarea, button { width: 100%; padding: 13px; border-radius: 8px; font-size: 15px; }
    input, select, textarea { border: 1px solid #cbd5e1; }
    button { border: none; cursor: pointer; font-weight: bold; background: #2563eb; color: white; }
   .delete { background: #dc2626; }.paid { background: #15803d; }.wa { background: #25D366; }
   .tools { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
   .tools button { width:auto; padding:10px 14px; font-size:14px; }
   .tools input { width:auto; max-width:250px; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 13px 10px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th { background: #f8fafc; }
   .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
<header><h1>حسابي V2</h1><p>المدير المالي لمشروعك - نسخة مطورة</p></header>
<main class="container">
  <section class="cards">
    <div class="card income"><h3>إجمالي الإيرادات</h3><div class="amount" id="totalIncome">0</div></div>
    <div class="card expenses"><h3>إجمالي المصروفات</h3><div class="amount" id="totalExpenses">0</div></div>
    <div class="card balance"><h3>الرصيد المتبقي</h3><div class="amount" id="balance">0</div></div>
  </section>

  <section class="section">
    <h2>إضافة عملية مالية</h2>
    <form id="transactionForm"><div class="form">
      <select id="type"><option value="income">إيراد</option><option value="expense">مصروف</option></select>
      <input id="description" placeholder="وصف العملية" required>
      <input id="amount" type="number" step="0.01" placeholder="المبلغ MRU" required>
      <input id="date" type="date" required>
      <button type="submit">حفظ العملية</button>
    </div></form>
  </section>

  <section class="section">
    <h2>سجل العمليات</h2>
    <div class="tools">
      <input id="searchTx" placeholder="🔍 بحث في الوصف..." oninput="render()">
      <button onclick="exportCSV()" style="background:#0f766e">📤 تصدير Excel</button>
      <button onclick="backupData()" style="background:#475569">💾 نسخة احتياطية</button>
      <button onclick="document.getElementById('restoreFile').click()" style="background:#334155">📥 استرجاع</button>
      <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreData(event)">
    </div>
    <div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>المبلغ</th><th>إجراء</th></tr></thead><tbody id="transactionsList"></tbody></table></div>
  </section>

  <section class="section">
    <h2>إدارة الديون - مع رقم الهاتف وواتساب</h2>
    <div class="cards">
      <div class="card debt-in"><h3>ديون لي</h3><div class="amount" id="debtsOwedToMe">0</div></div>
      <div class="card debt-out"><h3>ديون عليّ</h3><div class="amount" id="debtsIOwe">0</div></div>
    </div>
    <form id="debtForm" style="margin-top:15px"><div class="form">
      <select id="debtType"><option value="owedToMe">دين لي</option><option value="iOwe">دين عليّ</option></select>
      <input id="debtPerson" placeholder="اسم الشخص" required>
      <input id="debtPhone" placeholder="رقم واتساب (مثال 222...)" >
      <input id="debtAmount" type="number" step="0.01" placeholder="المبلغ MRU" required>
      <input id="debtDate" type="date" required>
      <button type="submit">حفظ الدين</button>
    </div></form>
    <div class="tools"><input id="searchDebt" placeholder="🔍 بحث باسم الشخص..." oninput="renderDebts()"></div>
    <div class="table-wrap"><table><thead><tr><th>النوع</th><th>الشخص</th><th>الأصل</th><th>المتبقي</th><th>إجراءات</th></tr></thead><tbody id="debtsList"></tbody></table></div>
  </section>
</main>

<script>
let transactions = JSON.parse(localStorage.getItem("hisabiTransactions")||"[]");
let debts = JSON.parse(localStorage.getItem("hisabiDebts")||"[]");
const today = () => new Date().toISOString().slice(0,10);
document.getElementById('date').value=today(); document.getElementById('debtDate').value=today();
const fmt = v => new Intl.NumberFormat('fr-MR').format(v);
const saveTx = () => localStorage.setItem("hisabiTransactions", JSON.stringify(transactions));
const saveDebts = () => localStorage.setItem("hisabiDebts", JSON.stringify(debts));

function render(){
  const q = (document.getElementById('searchTx').value||'').toLowerCase();
  let filtered = transactions.filter(t=> t.description.toLowerCase().includes(q));
  const inc = filtered.filter(i=>i.type==='income').reduce((s,i)=>s+i.amount,0);
  const exp = filtered.filter(i=>i.type==='expense').reduce((s,i)=>s+i.amount,0);
  document.getElementById('totalIncome').textContent=fmt(transactions.filter(i=>i.type==='income').reduce((s,i)=>s+i.amount,0))+' MRU';
  document.getElementById('totalExpenses').textContent=fmt(transactions.filter(i=>i.type==='expense').reduce((s,i)=>s+i.amount,0))+' MRU';
  document.getElementById('balance').textContent=fmt(transactions.filter(i=>i.type==='income').reduce((s,i)=>s+i.amount,0)-transactions.filter(i=>i.type==='expense').reduce((s,i)=>s+i.amount,0))+' MRU';
  const list=document.getElementById('transactionsList'); list.innerHTML='';
  [...filtered].reverse().forEach(item=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${item.date}</td><td>${item.type==='income'?'إيراد':'مصروف'}</td><td>${item.description}</td><td>${fmt(item.amount)}</td><td><button class="delete" onclick="delTx('${item.id}')">حذف</button></td>`;
    list.appendChild(tr);
  });
  renderDebts();
}
function renderDebts(){
  const q = (document.getElementById('searchDebt').value||'').toLowerCase();
  const rem = d => Math.max(0, d.amount - (d.payments||[]).reduce((s,p)=>s+p.amount,0));
  document.getElementById('debtsOwedToMe').textContent=fmt(debts.filter(d=>d.type==='owedToMe').reduce((s,d)=>s+rem(d),0))+' MRU';
  document.getElementById('debtsIOwe').textContent=fmt(debts.filter(d=>d.type==='iOwe').reduce((s,d)=>s+rem(d),0))+' MRU';
  const list=document.getElementById('debtsList'); list.innerHTML='';
  [...debts].filter(d=>d.person.toLowerCase().includes(q)).reverse().forEach(d=>{
    const left=rem(d);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${d.type==='owedToMe'?'لي':'عليّ'}</td><td>${d.person}<br><small>${d.phone||''}</small></td><td>${fmt(d.amount)}</td><td>${fmt(left)}</td>
    <td><div style="display:flex;gap:5px;flex-wrap:wrap">
      ${left>0?`<button class="paid" onclick="payDebt('${d.id}')">دفع</button>`:''}
      <button class="wa" onclick="waRem('${d.person}','${fmt(left)}','${d.phone||''}')">واتساب</button>
      <button class="delete" onclick="delDebt('${d.id}')">حذف</button>
    </div></td>`;
    list.appendChild(tr);
  });
}
window.delTx=id=>{ if(confirm('حذف؟')){ transactions=transactions.filter(t=>t.id!==id); saveTx(); render(); } }
window.delDebt=id=>{ if(confirm('حذف الدين؟')){ debts=debts.filter(d=>d.id!==id); saveDebts(); renderDebts(); } }
window.payDebt=id=>{
  const d=debts.find(x=>x.id===id); const left=Math.max(0, d.amount - (d.payments||[]).reduce((s,p)=>s+p.amount,0));
  const raw=prompt('مبلغ الدفعة، المتبقي: '+fmt(left)); if(raw===null) return;
  const v=Number(raw); if(!v||v<=0||v>left) return alert('مبلغ غير صحيح');
  d.payments=d.payments||[]; d.payments.push({amount:v, date:today()}); saveDebts(); renderDebts();
}
window.waRem=(person, amount, phone)=>{
  const msg=`السلام عليكم ${person}، تذكير بمبلغ ${amount} MRU المتبقي. شكرا`;
  const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}
window.exportCSV=()=>{
  let csv="التاريخ,النوع,الوصف,المبلغ\n"; transactions.forEach(t=>csv+=`${t.date},${t.type},${t.description},${t.amount}\n`);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='hisabi.csv'; a.click();
}
window.backupData=()=>{
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({transactions, debts})],{type:'application/json'}));
  a.download=`hisabi-backup-${today()}.json`; a.click();
}
window.restoreData=e=>{
  const r=new FileReader(); r.onload=ev=>{ try{ const o=JSON.parse(ev.target.result); transactions=o.transactions||transactions; debts=o.debts||debts; saveTx(); saveDebts(); render(); alert('تم الاسترجاع'); }catch{ alert('ملف خاطئ'); } }; r.readAsText(e.target.files[0]);
}

document.getElementById('transactionForm').addEventListener('submit',e=>{
  e.preventDefault();
  transactions.push({id:Date.now()+''+Math.random(), type:document.getElementById('type').value, description:document.getElementById('description').value, amount:Number(document.getElementById('amount').value), date:document.getElementById('date').value});
  saveTx(); e.target.reset(); document.getElementById('date').value=today(); render();
});
document.getElementById('debtForm').addEventListener('submit',e=>{
  e.preventDefault();
  debts.push({id:Date.now()+''+Math.random(), type:document.getElementById('debtType').value, person:document.getElementById('debtPerson').value, phone:document.getElementById('debtPhone').value, amount:Number(document.getElementById('debtAmount').value), date:document.getElementById('debtDate').value, payments:[]});
  saveDebts(); e.target.reset(); document.getElementById('debtDate').value=today(); renderDebts();
});
render();
</script>
</body>
</html>
