
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي V5</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#102b46">
<meta name="description" content="حسابي - المدير المالي">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f1f5f9;color:#0f172a}
header{background:#102b46;color:#fff;padding:16px}
.login-box{max-width:400px;margin:70px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #0001;text-align:center}
.section{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 12px #0001;margin-top:16px}
input,select,button{width:100%;padding:13px;border-radius:10px;font-size:14px;margin-top:8px}
input,select{border:1px solid #cbd5e1;background:#fff}
button{border:none;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
button:active{opacity:.8}
.small{font-size:12px;color:#64748b}
.badge{padding:4px 10px;border-radius:20px;color:#fff;font-size:12px}
.active{background:#16a34a}.expired{background:#dc2626}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:13px}
</style>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
  }
}
</script>
</head>
<body>

<div id="loginScreen" class="login-box">
<h2>حسابي</h2>
<p class="small">كل مشترك بياناته خاصة برقم هاتفه</p>
<input id="loginPhone" placeholder="رقم هاتف المحل">
<input id="adminKey" type="password" placeholder="كلمة سر الإدارة (أنت فقط)">
<button id="loginBtn">دخول</button>
<div id="msg" style="color:#dc2626;margin-top:10px;font-size:13px"></div>
<p class="small" style="margin-top:15px">الإدارة الافتراضية: 1234</p>
</div>

<div id="app" style="display:none">
<header style="display:flex;justify-content:space-between;align-items:center">
<div><b id="sName"></b><br><span id="sPhone" class="small" style="color:#cbd5e1"></span><div id="sExpire" class="small" style="color:#fde68a"></div></div>
<button onclick="location.reload()" style="width:auto;background:#334155;padding:8px 14px">خروج</button>
</header>

<main style="width:93%;max-width:1100px;margin:18px auto">

<div id="adminPanel" class="section" style="display:none;border:2px solid #102b46">
<h3>👑 لوحة تحكم حسابي</h3>
<p class="small">أنت لا ترى أموال المشتركين، فقط تدير اشتراكاتهم</p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px">
<input id="subName" placeholder="اسم المحل">
<input id="subPhone" placeholder="رقم الهاتف">
<select id="subPlan"><option value="30">30 يوم</option><option value="90">90 يوم</option><option value="365">سنة</option></select>
<button id="addSubBtn" style="background:#0f766e">إضافة</button>
</div>
<div id="subsList" style="margin-top:12px"></div>
</div>

<div id="userApp">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
<div class="section" style="margin:0;text-align:center"><div class="small">إيرادات</div><b id="tInc">0</b></div>
<div class="section" style="margin:0;text-align:center"><div class="small">مصروفات</div><b id="tExp">0</b></div>
<div class="section" style="margin:0;text-align:center"><div class="small">الرصيد</div><b id="tBal">0</b></div>
</div>

<div class="section">
<h4>عملية جديدة</h4>
<div style="display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:8px">
<select id="type"><option value="income">إيراد</option><option value="expense">مصروف</option></select>
<input id="desc" placeholder="الوصف">
<input id="am" type="number" placeholder="المبلغ MRU">
<button id="addTxBtn">حفظ</button>
</div>
<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>المبلغ</th><th></th></tr></thead><tbody id="txList"></tbody></table></div>
</div>

<div class="section">
<h4>الديون - واتساب</h4>
<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px">
<input id="debtPerson" placeholder="اسم الشخص">
<input id="debtAmount" type="number" placeholder="المبلغ">
<button id="addDebtBtn" style="background:#7c3aed">حفظ دين</button>
</div>
<div id="debtList" style="margin-top:10px"></div>
</div>
</div>

</main>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, updateDoc, addDoc, onSnapshot } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyDxxxxxxxxxxxxxxxxxxxxxxxx",
  authDomain: "hesabi-v5.firebaseapp.com",
  projectId: "hesabi-v5",
  storageBucket: "hesabi-v5.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef123456"
};
const ADMIN_PASS = "1234";

let app, db;
try {
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
} catch(e){ console.log("Local mode"); }

const $ = id => document.getElementById(id);
let currentPhone = null;
let isAdmin = false;

$("loginBtn").onclick = async () => {
  const phone = $("loginPhone").value.trim();
  const admin = $("adminKey").value.trim();
  const msg = $("msg");
  msg.textContent = "";
  if(admin === ADMIN_PASS){ isAdmin=true; currentPhone="ADMIN"; startApp({name:"حسابي - المدير",phone:"ADMIN",end:"دائم"}); return; }
  if(!phone){ msg.textContent="أدخل رقم الهاتف"; return; }
  if(!db){
    let subs = JSON.parse(localStorage.getItem('hisabiSubs')||'[]');
    let sub = subs.find(s=>s.phone===phone);
    if(!sub){ msg.textContent="غير مسجل"; return; }
    currentPhone=phone; startApp(sub); return;
  }
  try{
    const ref = doc(db, "subscribers", phone);
    const snap = await getDoc(ref);
    if(!snap.exists()){ msg.textContent="رقم غير مسجل"; return; }
    const data = snap.data();
    if(!data.active){ msg.textContent="اشتراكك معطل"; return; }
    if(new Date(data.end) < new Date()){ msg.textContent="انتهى اشتراكك: "+data.end; return; }
    currentPhone=phone; startApp(data);
  }catch(err){ msg.textContent="خطأ: "+err.message; }
};

function startApp(data){
  $("loginScreen").style.display="none";
  $("app").style.display="block";
  $("sName").textContent=data.name;
  $("sPhone").textContent=data.phone;
  $("sExpire").textContent= isAdmin ? "وضع الإدارة" : "ينتهي: "+data.end;
  if(isAdmin){ $("adminPanel").style.display="block"; loadSubs(); }
  loadUserData();
}

async function loadSubs(){
  if(!db){ $("subsList").innerHTML="<div class='small'>ركب Firebase ليظهر المشتركين</div>"; return; }
  const snap = await getDocs(collection(db, "subscribers"));
  let html=""; snap.forEach(d=>{
    const s=d.data(); const exp=new Date(s.end)<new Date();
    html+=`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><div><b>${s.name}</b> - ${s.phone}<br><span class="small">${s.end} <span class="badge ${exp||!s.active?'expired':'active'}">${exp?'منتهي':s.active?'ساري':'معطل'}</span></span></div><div style="display:flex;gap:5px"><button onclick="window.renewSub('${s.phone}')" style="width:auto;padding:6px 10px;background:#16a34a">+30</button><button onclick="window.toggleSub('${s.phone}')" style="width:auto;padding:6px 10px;background:#334155">تفعيل</button><button onclick="window.delSub('${s.phone}')" style="width:auto;padding:6px 10px;background:#dc2626">حذف</button></div></div>`;
  });
  $("subsList").innerHTML=html || "<div class='small'>لا يوجد مشتركين</div>";
}
window.toggleSub = async (phone)=>{ const ref=doc(db,"subscribers",phone); const snap=await getDoc(ref); await updateDoc(ref,{active:!snap.data().active}); loadSubs(); }
window.delSub = async (phone)=>{ if(!confirm("حذف نهائي؟")) return; await deleteDoc(doc(db,"subscribers",phone)); loadSubs(); }
window.renewSub = async (phone)=>{ const ref=doc(db,"subscribers",phone); const snap=await getDoc(ref); let e=new Date(snap.data().end); e.setDate(e.getDate()+30); await updateDoc(ref,{end:e.toISOString().slice(0,10),active:true}); loadSubs(); }
$("addSubBtn").onclick = async ()=>{
  const name=$("subName").value.trim(); const phone=$("subPhone").value.trim(); const days=Number($("subPlan").value);
  if(!name||!phone) return alert("أكمل البيانات");
  let end=new Date(); end.setDate(end.getDate()+days); const endStr=end.toISOString().slice(0,10);
  if(!db){ let subs=JSON.parse(localStorage.getItem('hisabiSubs')||'[]'); subs.push({id:Date.now()+'',name,phone,end:endStr,active:true}); localStorage.setItem('hisabiSubs',JSON.stringify(subs)); alert("تمت الإضافة محليا"); $("subName").value=""; $("subPhone").value=""; return; }
  await setDoc(doc(db,"subscribers",phone),{name,phone,start:new Date().toISOString().slice(0,10),end:endStr,active:true}); $("subName").value=""; $("subPhone").value=""; loadSubs(); alert("تم، يستطيع الدخول برقم "+phone);
};
function loadUserData(){
  if(isAdmin || !db){ renderLocal(); return; }
  onSnapshot(collection(db,"user_data",currentPhone,"transactions"), snap=>{ let list=[]; snap.forEach(d=>list.push({id:d.id,...d.data()})); renderTransactions(list); });
  onSnapshot(collection(db,"user_data",currentPhone,"debts"), snap=>{ let list=[]; snap.forEach(d=>list.push({id:d.id,...d.data()})); renderDebts(list); });
}
function renderLocal(){
  if(isAdmin) return;
  const tx=JSON.parse(localStorage.getItem('tx_'+currentPhone)||'[]');
  const debts=JSON.parse(localStorage.getItem('debt_'+currentPhone)||'[]');
  renderTransactions(tx); renderDebts(debts);
}
function renderTransactions(arr){
  let inc=0,exp=0; let html="";
  [...arr].reverse().forEach(t=>{ if(t.type==='income') inc+=Number(t.amount||0); else exp+=Number(t.amount||0); html+=`<tr><td>${t.date||''}</td><td>${t.type==='income'?'إيراد':'مصروف'}</td><td>${t.desc||''}</td><td>${t.amount||0}</td><td><button onclick="window.delTx('${t.id}')" style="width:auto;padding:4px 8px;background:#dc2626">حذف</button></td></tr>`; });
  $("tInc").textContent=inc; $("tExp").textContent=exp; $("tBal").textContent=inc-exp; $("txList").innerHTML=html;
}
function renderDebts(arr){
  let html=""; [...arr].reverse().forEach(d=>{ html+=`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>${d.person} - ${d.amount}</span><button onclick="window.delDebt('${d.id}')" style="width:auto;padding:4px 8px;background:#dc2626">حذف</button></div>`; });
  $("debtList").innerHTML=html;
}
$("addTxBtn").onclick = async ()=>{
  const data={type:$("type").value,desc:$("desc").value,amount:Number($("am").value),date:new Date().toISOString().slice(0,10)};
  if(!data.desc||!data.amount) return alert("أكمل");
  if(!db){ let a=JSON.parse(localStorage.getItem('tx_'+currentPhone)||'[]'); a.push({...data,id:Date.now()+''}); localStorage.setItem('tx_'+currentPhone,JSON.stringify(a)); $("desc").value=""; $("am").value=""; renderLocal(); return; }
  await addDoc(collection(db,"user_data",currentPhone,"transactions"), data); $("desc").value=""; $("am").value="";
}
$("addDebtBtn").onclick = async ()=>{
  const data={person:$("debtPerson").value,amount:Number($("debtAmount").value),date:new Date().toISOString().slice(0,10)};
  if(!data.person||!data.amount) return alert("أكمل");
  if(!db){ let a=JSON.parse(localStorage.getItem('debt_'+currentPhone)||'[]'); a.push({...data,id:Date.now()+''}); localStorage.setItem('debt_'+currentPhone,JSON.stringify(a)); $("debtPerson").value=""; $("debtAmount").value=""; renderLocal(); return; }
  await addDoc(collection(db,"user_data",currentPhone,"debts"), data); $("debtPerson").value=""; $("debtAmount").value="";
}
window.delTx = async (id)=>{ if(!db){ let a=JSON.parse(localStorage.getItem('tx_'+currentPhone)||'[]').filter(x=>x.id!==id); localStorage.setItem('tx_'+currentPhone,JSON.stringify(a)); renderLocal(); return; } await deleteDoc(doc(db,"user_data",currentPhone,"transactions",id)); }
window.delDebt = async (id)=>{ if(!db){ let a=JSON.parse(localStorage.getItem('debt_'+currentPhone)||'[]').filter(x=>x.id!==id); localStorage.setItem('debt_'+currentPhone,JSON.stringify(a)); renderLocal(); return; } await deleteDoc(doc(db,"user_data",currentPhone,"debts",id)); }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
