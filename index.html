<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي - المدير المالي لمشروعك</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#f0f4f8}.header{background:#0d47a1;color:#fff;padding:14px;text-align:center;font-weight:bold;position:sticky;top:0}.card{background:#fff;margin:10px;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:10px}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.btn-blue{background:#0d47a1;color:#fff}.btn-green{background:#2e7d32;color:#fff}.btn-red{background:#c62828;color:#fff;width:auto;padding:4px 10px}.btn-grey{background:#455a64;color:#fff}.hidden{display:none}.tabs{display:flex;gap:8px}.tab{flex:1;padding:10px;text-align:center;background:#e3f2fd;border-radius:10px;cursor:pointer;font-weight:bold}.tab.active{background:#0d47a1;color:#fff}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;border-radius:12px;text-align:center;font-weight:bold;font-size:14px}.s1{background:#e3f2fd}.s2{background:#e8f5e9}.s3{background:#ffebee}.s4{background:#fff8e1}.s5{background:#e0f7fa;border:2px solid #0d47a1}.item{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:#666}.badge{padding:2px 8px;border-radius:20px;font-size:11px;color:#fff}.b-income{background:#2e7d32}.b-expense{background:#c62828}.b-debt{background:#ef6c00}.b-cdebt{background:#0d47a1}</style></head><body>
<div class="header">💼 حسابي - المدير المالي لمشروعك</div>
<div id="pub"><div class="card"><div class="tabs"><div class="tab active" id="t1" onclick="st('login')">دخول</div><div class="tab" id="t2" onclick="st('reg')">تسجيل جديد</div></div>
<div id="lb"><h3 style="text-align:center">دخول</h3><input id="lp" placeholder="رقم الهاتف"><input id="lpa" type="password" placeholder="كلمة السر"><button class="btn btn-blue" onclick="sLogin()">دخول لحسابي</button><div id="lm" class="small" style="color:red;text-align:center"></div></div>
<div id="rb" class="hidden"><h3 style="text-align:center">طلب اشتراك</h3><input id="rn" placeholder="اسمك / اسم المحل"><input id="rp" placeholder="رقم هاتفك"><input id="rpa" type="password" placeholder="كلمة سر"><select id="rd"><option value="1">شهر</option><option value="3" selected>3 أشهر</option><option value="6">6 أشهر</option><option value="12">سنة</option></select><button class="btn btn-green" onclick="sReq()">إرسال طلب</button><div id="rm" class="small" style="text-align:center"></div></div></div></div>
<div id="sub" class="hidden"><div class="card"><h3 id="sh" style="margin:0"></h3><p class="small" id="ss" style="margin:4px 0"></p>
<div class="stat-grid"><div class="stat s2">💰 مداخيل<div id="mi">0</div></div><div class="stat s4">💸 مصاريف<div id="mo">0</div></div><div class="stat s3">📉 ديون عليّ<div id="md">0</div></div><div class="stat s1">📈 ديون لي<div id="mc">0</div></div><div class="stat s5" style="grid-column:span 2">💼 صافي الرصيد<div id="net" style="font-size:18px">0</div></div></div>
<div style="margin-top:10px"><label class="small">تصفية:</label><select id="mf" onchange="rS()"><option value="all">كل الأشهر</option><option value="0">يناير</option><option value="1">فبراير</option><option value="2">مارس</option><option value="3">أبريل</option><option value="4">مايو</option><option value="5">يونيو</option><option value="6">يوليو</option><option value="7">أغسطس</option><option value="8">سبتمبر</option><option value="9">أكتوبر</option><option value="10">نوفمبر</option><option value="11">ديسمبر</option></select></div></div>
<div class="card"><h4>➕ إضافة عملية (دقيقة)</h4><select id="ot"><option value="income">مدخول</option><option value="expense">مصروف</option><option value="debt">دين عليّ</option><option value="clientDebt">دين زبون لي</option></select><input id="oa" type="number" placeholder="المبلغ بالأوقية"><input id="on" placeholder="البيان / اسم الزبون / السبب"><input id="od" type="date"><button class="btn btn-blue" onclick="aOp()">حفظ العملية ✓</button><div id="ol" style="margin-top:10px"></div></div><button class="btn btn-grey" style="margin:12px" onclick="lo()">خروج</button></div>
<script>
let db=JSON.parse(localStorage.getItem('hisabi_final_v3')||'{"subs":[],"trans":[],"pends":[]}');function sv(){localStorage.setItem('hisabi_final_v3',JSON.stringify(db))}let cur=null;od.valueAsDate=new Date();
function st(t){lb.classList.toggle('hidden',t!='login');rb.classList.toggle('hidden',t!='reg');t1.classList.toggle('active',t=='login');t2.classList.toggle('active',t=='reg')}
function sReq(){let n=rn.value.trim(),p=rp.value.trim(),pa=rpa.value.trim(),d=parseInt(rd.value);if(!n||!p||!pa){rm.innerText='أكمل';return}if(db.subs.find(s=>s.phone==p)||db.pends.find(s=>s.phone==p)){rm.innerText='مسجل';return}db.pends.push({name:n,phone:p,pass:pa,dur:d,date:new Date().toISOString()});sv();rm.style.color='green';rm.innerText='تم إرسال طلبك'}
function sLogin(){let p=lp.value.trim(),pa=lpa.value.trim(),s=db.subs.find(x=>x.phone==p&&x.pass==pa);if(!s){lm.innerText='خطأ أو لم تتم الموافقة';return}if(new Date(s.expiry)<new Date()){lm.innerText='انتهى';return}cur=s;pub.classList.add('hidden');sub.classList.remove('hidden');sh.innerText='مرحبا '+s.name;ss.innerText=s.start.split('T')[0]+' → '+s.expiry.split('T')[0];rS()}
function rS(){let f=mf.value,my=db.trans.filter(t=>t.phone==cur.phone);if(f!='all'){my=my.filter(t=>new Date(t.date).getMonth()==parseInt(f))}let inc=my.filter(t=>t.type=='income').reduce((a,b)=>a+b.amount,0),exp=my.filter(t=>t.type=='expense').reduce((a,b)=>a+b.amount,0),debt=my.filter(t=>t.type=='debt').reduce((a,b)=>a+b.amount,0),cdebt=my.filter(t=>t.type=='clientDebt').reduce((a,b)=>a+b.amount,0);mi.innerText=inc;mo.innerText=exp;md.innerText=debt;mc.innerText=cdebt;net.innerText=inc-exp-debt;net.style.color=inc-exp-debt>=0?'#2e7d32':'#c62828';ol.innerHTML=my.length?'':'لا عمليات';my.slice().reverse().forEach((t,i)=>{let idx=db.trans.indexOf(t);let label={income:'مدخول',expense:'مصروف',debt:'دين عليّ',clientDebt:'دين لي'}[t.type];let cls={income:'b-income',expense:'b-expense',debt:'b-debt',clientDebt:'b-cdebt'}[t.type];ol.innerHTML+=`<div class="item"><div><span class="badge ${cls}">${label}</span> <b>${t.amount}</b> - ${t.note}<br><small class="small">${t.date.split('T')[0]}</small></div><div><button class="btn-red" onclick="delOp(${idx})">✕</button></div></div>`})}
function aOp(){let t=ot.value,a=parseFloat(oa.value||0),n=on.value.trim(),d=od.value;if(!a||!n){alert('أدخل المبلغ والبيان');return}db.trans.push({phone:cur.phone,type:t,amount:a,note:n,date:d?new Date(d).toISOString():new Date().toISOString()});sv();rS();oa.value='';on.value='';od.valueAsDate=new Date()}
function delOp(i){if(confirm('حذف العملية؟')){db.trans.splice(i,1);sv();rS()}}
function lo(){pub.classList.remove('hidden');sub.classList.add('hidden')}
</script></body></html>
