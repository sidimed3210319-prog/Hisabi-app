<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - دخول</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<script>
// استبدل هذا بالإعدادات من Firebase Console > Project Settings
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "hisabiapp-c3a50.firebaseapp.com",
  projectId: "hisabiapp-c3a50"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function register(){
  let phone = document.getElementById('phone').value;
  let name = document.getElementById('name').value;
  let pass = document.getElementById('pass').value;

  // هذا السطر هو الحل - يحفظ في السحابة ويصل للإدارة فورا
  db.collection("users").add({
    phone: phone,
    name: name,
    password: pass,
    status: "pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    alert("تم إرسال طلبك للإدارة، انتظر الموافقة ⏳");
  });
}

function login(){
  let phone = document.getElementById('phone').value;
  let pass = document.getElementById('pass').value;
  db.collection("users").where("phone","==",phone).where("password","==",pass).get().then(snap=>{
    if(snap.empty){ alert("بيانات خاطئة"); return; }
    let u = snap.docs[0].data();
    if(u.status=="pending"){
      alert("حسابك قيد المراجعة من الإدارة");
    } else if(u.status=="active"){
      localStorage.setItem("user", phone);
      location.href="dashboard.html";
    } else {
      alert("تم رفض حسابك");
    }
  });
}
document.addEventListener('keyup',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
